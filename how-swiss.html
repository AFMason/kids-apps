<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How Swiss Is It?</title>
<meta name="theme-color" content="#1d1210">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap">
<style>
/* Layout: one phone-width column; a postcard-style spectrum card above a big draggable dial. Dusk in the outback, snow on the cards. */
:root {
  --bg: #1d1210;
  --bg2: #2b1b16;
  --bg3: #3a2620;
  --fg: #f6efe4;
  --muted: #c2a998;
  --line: rgba(246, 239, 228, .14);
  --snow: #eef3f6;
  --ochre: #e7a03c;
  --ink: #1d1210;
  --red: #e0301e;
  --gold: #ffc72c;
  --orange: #f2812a;
  --green: #2bb36a;
  --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: radial-gradient(120% 60% at 50% 0%, #3a1f17 0%, var(--bg) 60%) fixed, var(--bg);
  color: var(--fg);
  font: 16px/1.45 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 10px) calc(env(safe-area-inset-bottom, 0px) + 24px);
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font: 800 20px/1 var(--display); letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand .x { width: 22px; height: 22px; border-radius: 5px; background: var(--red); position: relative; flex: none; }
.brand .x::before, .brand .x::after { content: ""; position: absolute; background: #fff; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.brand .x::before { width: 12px; height: 4px; }
.brand .x::after { width: 4px; height: 12px; }
.roomchip { font: 600 13px/1 var(--mono); letter-spacing: .12em; background: var(--bg3); border: 1px solid var(--line); padding: 7px 10px; border-radius: 999px; display: flex; align-items: center; gap: 8px; }
.hright { display: flex; align-items: center; gap: 8px; }
.homebtn { font: 700 14px/1 var(--body, inherit); padding: 8px 12px; border-radius: 999px; background: var(--bg3); border: 1px solid var(--line); color: inherit; min-height: 0; width: auto; white-space: nowrap; }
.homebtn.arm { background: var(--red); border-color: var(--red); color: #fff; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--green); box-shadow: 0 0 0 3px rgba(43, 179, 106, .25); }
.dot.off { background: var(--red); }

h1 { font: 800 clamp(34px, 10vw, 46px)/.95 var(--display); letter-spacing: -.02em; margin: 6px 0 0; text-wrap: balance; }
h2 { font: 800 26px/1.05 var(--display); margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

input[type=text] {
  width: 100%; font: 600 18px var(--body); color: var(--fg); background: var(--bg2);
  border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 14px; outline: none;
}
input[type=text]:focus { border-color: var(--gold); }
input.code { font: 600 22px var(--mono); letter-spacing: .3em; text-transform: uppercase; text-align: center; }

button { font: 700 17px var(--body); border: 0; border-radius: 14px; padding: 15px 18px; cursor: pointer; color: var(--ink); background: var(--gold); transition: transform .08s, filter .15s; }
button:active { transform: scale(.97); }
button:focus-visible { outline: 3px solid var(--snow); outline-offset: 2px; }
button[disabled] { opacity: .45; cursor: default; }
button.ghost { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
button.red { background: var(--red); color: #fff; }
button.big { width: 100%; font-size: 19px; padding: 17px; }
button.link { background: none; color: var(--muted); padding: 6px; font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }

.flags { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.flagbtn { background: var(--bg2); color: var(--fg); border: 2px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px; font-size: 15px; }
.flag { height: 1em; width: auto; display: inline-block; vertical-align: -0.15em; border-radius: 2px; }
.flagbtn .f { font-size: 34px; line-height: 1; }
.flagbtn.sel { border-color: var(--gold); background: var(--bg3); }

.panel { background: var(--bg2); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

.players { display: flex; flex-wrap: wrap; gap: 8px; }
.pchip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px 7px 8px; border-radius: 999px; background: var(--bg3); border: 1.5px solid transparent; font-weight: 600; font-size: 15px; }
.pchip .f { font-size: 18px; line-height: 1; }
.pchip.off { opacity: .4; }
.pchip.ready { border-color: var(--green); }
.pchip.giver { border-color: var(--gold); }
.pchip .you { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }

.qrbox { display: flex; gap: 16px; align-items: center; }
.qr { background: #fff; padding: 10px; border-radius: 12px; flex: none; line-height: 0; }
.qr img, .qr canvas { width: 132px !important; height: 132px !important; display: block; }
.bigcode { font: 600 30px/1 var(--mono); letter-spacing: .14em; }

/* Postcard spectrum card */
.card {
  display: grid; grid-template-columns: 1fr 1fr; border-radius: 14px; overflow: hidden; color: var(--ink);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .35); position: relative; text-align: left; padding: 0; width: 100%;
  font: inherit; background: none;
}
.card > span { padding: 16px 14px; font: 800 22px/1.08 var(--display); min-height: 80px; display: flex; align-items: center; min-width: 0; overflow-wrap: anywhere; }
.card .l { background: var(--snow); }
.card .r { background: var(--ochre); text-align: right; justify-content: flex-end; }

.banner { background: var(--bg3); border-radius: 14px; padding: 14px 16px; font-size: 18px; line-height: 1.35; }
.banner b { font-weight: 700; }
.banner .f { font-size: 20px; }
.banner.you { background: var(--gold); color: var(--ink); }
.rules { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 6px; font-size: 18px; }
.gamebtn { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; }
.gamebtn b { font: 800 22px/1.1 var(--display); }
.gamebtn span { font-weight: 500; font-size: 15px; line-height: 1.35; }
.gamebtn.quizbtn { background: var(--snow); }
.gamebtn.precbtn { background: var(--red); color: #fff; }
.gamebtn.mostbtn { background: var(--green); color: #fff; }
.gamebtn.neutralbtn { background: #2d4a7a; color: #fff; }
.gamebtn.kidsbtn { background: linear-gradient(135deg, #7ec8f2, #b48cf0); color: #1a1240; }
.kidq { font-size: 30px; line-height: 1.2; }
.gamebtn.secretsbtn { background: linear-gradient(135deg, #b8174a, #e0301e 60%, #f2812a); color: #fff; }
.banner.event { background: #4a2a5e; color: #fff; }
.yn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.yn .opt { text-align: center; font-size: 20px; padding: 18px 10px; }
.guess { display: flex; gap: 8px; flex-wrap: wrap; }
.gopt { flex: 1 1 48px; min-width: 48px; background: var(--bg3); color: var(--fg); border: 2px solid transparent; font: 800 24px var(--display); padding: 12px 0; }
.gopt.sel { border-color: var(--gold); background: #4a3020; }
.glist { display: flex; flex-wrap: wrap; gap: 8px; }
.ngscore { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 15px; font-variant-numeric: tabular-nums; }
.ngscore b { font: 800 22px var(--display); color: var(--gold); }
.banner.good { background: var(--green); color: #fff; }
.banner.fart { background: #7a8a1e; color: #fff; font-size: 19px; animation: shake .5s 3; }
@keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-6px) rotate(-1deg); } 75% { transform: translateX(6px) rotate(1deg); } }
.peek { position: relative; border-radius: 16px; background: var(--bg3); border: 2px dashed var(--line); min-height: 92px; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; cursor: pointer; }
.peek-cover { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px; font-weight: 700; font-size: 17px; color: var(--muted); }
.peek-in { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; visibility: hidden; }
.peek.open .peek-in { visibility: visible; }
.peek.open .peek-cover { display: none; }
.peek.open { background: var(--snow); color: var(--ink); border-style: solid; border-color: var(--gold); }
.peek .role { font: 800 22px var(--display); }
.peek .kraut { background: #e9efc0; border-radius: 10px; padding: 8px 10px; }
.copt:disabled { opacity: .35; text-decoration: line-through; }
.tablewrap { overflow-x: auto; }
.lies { border-collapse: collapse; width: 100%; font-size: 15px; text-align: center; }
.lies th, .lies td { padding: 7px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.lies th { font-weight: 700; font-size: 13px; }
.lies .sm { background: rgba(224, 48, 30, .18); }
@media (prefers-reduced-motion: reduce) { .banner.fart { animation: none; } }
.gamebtn.spicybtn { background: #b8174a; color: #fff; }
.gamepair { display: grid; grid-template-columns: 1.6fr 1fr; gap: 10px; }
.gamepair .gamebtn { height: 100%; }
@media (max-width: 360px) { .gamepair { grid-template-columns: 1fr; } }
.vopt { display: flex; align-items: center; gap: 10px; font-size: 20px; }
.vopt .f { font-size: 22px; line-height: 1; }
.vopt .you { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: minmax(0, 9em) 1fr auto; gap: 10px; align-items: center; font-weight: 600; }
.bar .bn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .bt { height: 14px; background: var(--bg3); border-radius: 7px; overflow: hidden; }
.bar .bt span { display: block; height: 100%; background: var(--gold); border-radius: 7px; transition: width .6s; }
.bar b { font: 800 20px var(--display); font-variant-numeric: tabular-nums; min-width: 1.2em; text-align: right; }
.lives { display: inline-flex; gap: 4px; font-size: 18px; align-items: center; }
.banner.bad { background: var(--red); color: #fff; }
.pile { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; }
.pnum { font: 800 96px/1 var(--display); color: var(--gold); font-variant-numeric: tabular-nums; }
.trail { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; color: var(--muted); font: 600 15px var(--mono); }
.hand { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.ncard { min-width: 62px; padding: 14px 10px; text-align: center; border-radius: 12px; background: var(--snow); color: var(--ink); font: 800 30px/1 var(--display); font-variant-numeric: tabular-nums; }
.ncard.low { background: var(--gold); }
.ncard:not(.low) { opacity: .6; }
.cnt { color: var(--gold); }
.teambar { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
.teambar .tm { display: inline-flex; align-items: center; gap: 8px; font-size: 22px; }
.teambar .tm b { font: 800 26px var(--display); }
.teambar.big .tm b { font-size: 44px; }
.teambar.big .tm { font-size: 34px; }
.qcard { background: var(--bg2); border: 1px solid var(--line); border-radius: 18px; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; }
.qcard h2 { font-size: 25px; line-height: 1.15; }
.qtag { align-self: flex-start; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.opts { display: grid; gap: 10px; }
.opt { display: block; width: 100%; text-align: left; background: var(--bg3); color: var(--fg); border: 2px solid transparent; border-radius: 14px; padding: 16px; font: 600 18px/1.25 var(--body); }
.opt.sel { border-color: var(--gold); background: #4a3020; }
.opt.right { background: var(--green); color: #fff; font-weight: 700; }
.opt.wrong { opacity: .4; }
.opt.wrong.mine { opacity: 1; border-color: var(--red); }

.dialwrap { position: relative; touch-action: none; user-select: none; -webkit-user-select: none; }
.dialwrap svg { width: 100%; height: auto; display: block; overflow: visible; }
.dialwrap.drag { cursor: grab; }
.bands { transform-origin: 100px 105px; }
.reveal .bands { animation: fan .7s cubic-bezier(.2, .9, .3, 1.2) both; }
@keyframes fan { from { transform: scale(0) rotate(-40deg); opacity: 0; } to { transform: none; opacity: 1; } }
.pts { text-align: center; }
.pts .n { font: 800 72px/1 var(--display); color: var(--gold); }
.pts .n.zero { color: var(--muted); }
.score { display: flex; justify-content: space-between; align-items: baseline; font-variant-numeric: tabular-nums; }
.score b { font: 800 22px var(--display); }
.note { background: var(--bg3); border-radius: 12px; padding: 10px 12px; font-size: 14px; color: var(--muted); }
.hist { display: flex; flex-direction: column; gap: 8px; }
.hist .h { display: grid; grid-template-columns: 1fr auto; gap: 10px; background: var(--bg2); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.hist .h b { font: 800 20px var(--display); color: var(--gold); align-self: center; font-variant-numeric: tabular-nums; }
.hist .h .c { min-width: 0; overflow-wrap: anywhere; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); background: var(--snow); color: var(--ink); font-weight: 700; padding: 10px 16px; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,.4); z-index: 5; max-width: calc(100vw - 32px); text-align: center; }
@media (prefers-reduced-motion: reduce) { .reveal .bands { animation: none; } button { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="x" aria-hidden="true"></span>How Swiss Is It?</div>
    <div class="hright"><button type="button" class="homebtn" id="homeBtn" hidden>🏠 Lobby</button><div class="roomchip" id="roomchip" hidden><span class="dot" id="dot"></span><span id="roomcode"></span></div></div>
  </header>
  <main id="app" class="stack"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
"use strict";
// ---------- Spectrum cards: [left, right] ----------
const CARDS = [
  ["Very Swiss", "Very Aussie"], ["Punctual", "She'll be right"], ["Polite", "Rude"],
  ["Harmless animal", "Will kill you"], ["Fine at a BBQ", "Banned from the BBQ"],
  ["Fine after 10pm in a Swiss flat", "Neighbours call the Hausverwaltung"],
  ["Real cheese", "Not cheese"], ["Overrated", "Underrated"], ["Good chocolate", "Bad chocolate"],
  ["Normal price in Zürich", "Outrageous even for Zürich"], ["Boring", "Thrilling"], ["Healthy", "Unhealthy"],
  ["Snow sport", "Beach sport"], ["Easy for Aussies to say", "Impossible for Aussies to say"],
  ["Swiss would understand", "Pure Aussie slang"], ["Fancy", "Daggy"], ["Formal", "Casual"],
  ["Hero", "Villain"], ["Smells great", "Smells terrible"], ["Great breakfast", "Terrible breakfast"],
  ["Better hot", "Better cold"], ["Useless superpower", "Amazing superpower"], ["Mountain holiday", "Beach holiday"],
  ["Waste of money", "Worth every franc"], ["Normal pet", "Weird pet"], ["Calm", "Chaos"],
  ["Delicious", "Disgusting"], ["Hard to make", "Easy to make"], ["Quiet", "Loud"],
  ["Uncool", "Cool"], ["Swiss would do it", "Swiss would never"], ["Aussie would do it", "Aussie would never"],
  ["Skill", "Luck"], ["Good first date", "Terrible first date"], ["Romantic", "Unromantic"],
  ["Safe job", "Dangerous job"], ["Gets better with age", "Gets worse with age"],
  ["Fun to watch", "Fun to play"], ["Worth queuing for", "Not worth queuing for"],
  ["Fine on a tram", "Never on a tram"], ["Great Christmas tradition", "Terrible Christmas tradition"],
  ["Sounds made up", "Sounds real"], ["Easy language", "Hard language"], ["Natural", "Artificial"],
  ["Weak coffee", "Strong coffee"], ["Normal sandwich filling", "Unhinged sandwich filling"],
  ["Better in Switzerland", "Better in Australia"], ["Needs a permit", "Nobody cares"],
  ["Tourist trap", "Hidden gem"], ["Couch potato", "Mountain goat"], ["Dated", "Timeless"],
  ["Small", "Huge"], ["Cheap", "Expensive"], ["Kids' thing", "Grown-up thing"],
  ["Tidy", "Messy"], ["Safe to swim", "Do not swim"], ["Underdressed", "Overdressed"],
  ["Basic skill", "Impressive skill"], ["Rural", "Urban"], ["Beautiful word", "Ugly word"],
  ["Fair dinkum", "Dodgy"], ["Gemütlich", "Uncomfortable"], ["Neutral", "Picks a side"],
  ["Scary", "Cute"], ["Good gift", "Bad gift"], ["Sporty", "Unsporty"], ["Necessity", "Luxury"],
  ["Lekker", "Yuck"], ["Old-fashioned", "Modern"], ["Minor inconvenience", "Total disaster"]
];
const BANDS = [[17.5, 2], [10.5, 3], [3.5, 4]]; // half-width, points
const PREFIX = "howswissisit-v2";
const BROKERS = ["wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt"];
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";

// ---------- small utils ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d, ses) { try { const v = (ses ? sessionStorage : localStorage).getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v, ses) { try { (ses ? sessionStorage : localStorage).setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function hashStr(str) { let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return (h ^= h >>> 16) >>> 0; }; }
function rng(seed) { let a = hashStr(seed)(); return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function randId(n, chars = "abcdefghijkmnpqrstuvwxyz23456789") { let s = ""; const a = crypto.getRandomValues(new Uint8Array(n)); for (const b of a) s += chars[b % chars.length]; return s; }
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

// ---------- identity & connection ----------
const myId = store.get("hs_id", null, true) || randId(10); store.set("hs_id", myId, true);
let profile = store.get("hs_profile", { name: "", flag: "" });
const params = new URLSearchParams(location.search);
let room = (params.get("room") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6) || null;
let brokerIdx = Math.min(BROKERS.length - 1, Math.max(0, parseInt(params.get("b") || "0", 10) || 0));
let joined = false, isCreator = false, client = null, connected = false;
let S = null;            // shared game state (last-writer-wins by version)
let players = {};        // id -> {name, flag, joined, ready}
let online = {};         // id -> bool
let dragging = false, localDial = null, pubTimer = null, lastPub = 0;
let wakeLock = null;
const base = () => `${PREFIX}/${room}`;

function connect() {
  if (client) { try { client.end(true); } catch (e) {} }
  connected = false;
  client = mqtt.connect(BROKERS[brokerIdx], {
    clientId: "hs_" + myId + "_" + randId(4), keepalive: 30, reconnectPeriod: 2000, connectTimeout: 8000, clean: true,
    will: { topic: `${base()}/online/${myId}`, payload: "0", retain: true, qos: 1 }
  });
  let everConnected = false;
  const fallback = setTimeout(() => {
    if (!everConnected && isCreator && brokerIdx < BROKERS.length - 1) { brokerIdx++; updateUrl(); connect(); }
  }, 9000);
  client.on("connect", () => {
    everConnected = true; clearTimeout(fallback); connected = true;
    client.subscribe(`${base()}/#`, { qos: 1 });
    client.publish(`${base()}/online/${myId}`, "1", { retain: true, qos: 1 });
    pubPlayer();
    render();
  });
  const down = () => { connected = false; patch(); };
  client.on("offline", down); client.on("close", down);
  client.on("message", onMessage);
}
function onMessage(topic, buf) {
  const sub = topic.slice(base().length + 1), txt = buf.toString();
  if (sub === "state") {
    if (!txt) return;
    let s; try { s = JSON.parse(txt); } catch (e) { return; }

const QUIZ_EACH = 10; // questions per country per game (20 a game)
function quizOrder(game) {

  const au = pick("au"), ch = pick("ch"), out = [];
  for (let i = 0; i < QUIZ_EACH; i++) out.push(i % 2 ? ch[i] : au[i], i % 2 ? au[i] : ch[i]);
  return out;
}
function optOrder(game, qi) { const o = [0, 1, 2, 3], r = rng(`${room}:${game}:opt${qi}`); for (let i = 3; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } return o; }

// The room remembers every quiz question shown (qseen), so new games pick unseen ones first.
function quizPick(n) {

    let pool = QUIZ.filter(q => q.c === c && !seen.has(q.q)).map(q => q.q);
    if (pool.length < QUIZ_EACH) { const all = QUIZ.filter(q => q.c === c).map(q => q.q); n.qseen = (n.qseen || []).filter(t => !all.includes(t)); pool = all; }
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    const must = pool.filter(t => (QUIZ.find(q => q.q === t) || {}).must); pool = [...must, ...pool.filter(t => !must.includes(t))];
    lists[c] = pool.slice(0, QUIZ_EACH);

  for (let i = 0; i < QUIZ_EACH; i++) out.push(i % 2 ? lists.ch[i] : lists.au[i], i % 2 ? lists.au[i] : lists.ch[i]);
  return out;
}

}

const CX = 100, CY = 105, R = 92;
function pt(v, r = R) { const a = Math.PI * (1 - v / 100); return [CX + r * Math.cos(a), CY - r * Math.sin(a)]; }
function wedge(a, b) { a = Math.max(0, a); b = Math.min(100, b); const [x1, y1] = pt(a), [x2, y2] = pt(b); return `M${CX} ${CY}L${x1.toFixed(2)} ${y1.toFixed(2)}A${R} ${R} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}Z`; }

  const ticks = [];
  for (let i = 0; i <= 20; i++) { const v = i * 5, [x1, y1] = pt(v, R + 3), [x2, y2] = pt(v, R + (i % 5 ? 7 : 11)); ticks.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--muted)" stroke-width="${i % 5 ? .8 : 1.6}" stroke-linecap="round"/>`); }
  const colors = { 2: "var(--gold)", 3: "var(--orange)", 4: "var(--red)" };
  const bands = t == null ? "" : `<g class="bands">${BANDS.map(([w, p]) => `<path d="${wedge(t - w, t + w)}" fill="${colors[p]}"/>`).join("")}
    ${[[-14, 2], [-7, 3], [0, 4], [7, 3], [14, 2]].filter(([o]) => t + o >= 0 && t + o <= 100).map(([o, p]) => { const [x, y] = pt(t + o, R - 12); return `<text x="${x.toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="middle" font-family="var(--display)" font-weight="800" font-size="9" fill="${p === 4 ? "#fff" : "var(--ink)"}">${p}</text>`; }).join("")}</g>`;
  const [nx, ny] = pt(dial, R - 4);
  return `<svg viewBox="-6 0 212 116" role="img" aria-label="Dial, needle at ${Math.round(dial)} of 100">
    <path d="${wedge(0, 100)}" fill="var(--bg3)" stroke="var(--line)"/>
    ${bands}
    ${ticks.join("")}
    <g id="needle" ${showNeedle ? "" : 'style="display:none"'}>
      <line id="nl" x1="${CX}" y1="${CY}" x2="${nx.toFixed(2)}" y2="${ny.toFixed(2)}" stroke="var(--snow)" stroke-width="3.5" stroke-linecap="round"/>
      <circle id="nk" cx="${nx.toFixed(2)}" cy="${ny.toFixed(2)}" r="6" fill="var(--snow)" stroke="var(--ink)" stroke-width="1.5"/>
    </g>
    <circle cx="${CX}" cy="${CY}" r="8" fill="var(--red)"/>
    <rect x="${CX - 4}" y="${CY - 1.3}" width="8" height="2.6" fill="#fff"/><rect x="${CX - 1.3}" y="${CY - 4}" width="2.6" height="8" fill="#fff"/>

function bindDrag(el) {

    <div class="bars">${ids.map(id => `<div class="bar"><span class="bn">${pflag(id)} ${esc(pname(id))}</span><span class="bt"><span style="width:${(tot[id] || 0) / Math.max(1, tot[worst] || 1) * 100}%"></span></span><b>${tot[id] || 0}</b></div>`).join("")}</div>
    <button class="big" id="againMost">Play again</button>
    <button class="ghost" id="lobbyBtn">Back to the lobby</button>`;
  return `<div class="stack" style="text-align:center;gap:8px;padding-top:10px"><span class="label">Biggest menace</span>
      <div style="font-size:64px;line-height:1">${worst ? pflag(worst) : ""}</div>
      <h1 style="margin:0">${worst ? esc(pname(worst)) : "Nobody"}</h1><p class="muted">${worst ? `${tot[worst] || 0} votes and ${crowns[worst] || 0} crowns. Everyone thinks the worst of you.` : ""}</p></div>
    <div class="note">${natLine}</div>
    <div class="bars">${ids.map(id => `<div class="bar"><span class="bn">${pflag(id)} ${esc(pname(id))}</span><span class="bt"><span style="width:${(tot[id] || 0) / Math.max(1, tot[worst] || 1) * 100}%"></span></span><b>${tot[id] || 0}</b></div>`).join("")}</div>
    <button class="big" id="againMost">Play again</button>
    <button class="ghost" id="lobbyBtn">Back to the lobby</button>`;
}
function precTop() {
  const hearts = Array.from({ length: S.lives }, () => FLAG_CH).join(" ");
  return `<div class="score"><span class="label">Level ${S.level} of ${S.maxLevel}</span><span class="lives" aria-label="${S.lives} lives left"><span class="label">Lives</span> ${hearts}</span></div>`;
}
function ppHtml() {
  const h = precHands(S), mine = h[myId], inGame = S.order.includes(myId);
  const last = S.played[S.played.length - 1];
  const m = S.mistake && S.mistake.at === S.played.length ? S.mistake : null;
  const others = S.order.filter(id => id !== myId).map(id => `<span class="pchip"><span class="f">${pflag(id)}</span>${esc(pname(id))} <b class="cnt">${h[id].length}</b></span>`).join("");
  return `${precTop()}
    ${m ? `${lateBanner(m)}`
        : `<div class="banner">🤫 <b>No talking.</b> Play your lowest card when it feels right.</div>`}
    <div class="pile"><span class="label">Last departure</span><div class="pnum">${last ? last.v : "–"}</div><div class="trail">${S.played.slice(-8, -1).map(p => `<span>${p.v}</span>`).join("")}</div></div>
    ${!inGame ? `<p class="muted" style="text-align:center">You joined late. You're watching this one.</p>`
      : mine.length ? `<div class="hand">${mine.map((v, i) => `<span class="ncard ${i ? "" : "low"}">${v}</span>`).join("")}</div><button class="big" id="playBtn">Play ${mine[0]}</button>`
      : `<p class="muted" style="text-align:center">You're out of cards. Watch the others sweat.</p>`}
    <div class="stack" style="gap:8px"><span class="label">Cards left</span><div class="players">${others}</div></div>`;
}
function plHtml() {
  const m = S.mistake && S.mistake.at === S.played.length ? S.mistake : null;
  return `${precTop()}
    ${m ? `${lateBanner(m)}` : ""}
    <div class="pts" style="padding-top:20px"><div class="n">✓</div><h2>Level ${S.level} done. On time!</h2><p class="muted">Next level: everyone gets ${S.level + 1} cards.</p></div>
    <button class="big" id="precNextBtn">Next level</button>`;
}
function pendHtml() {
  const reached = S.won ? S.maxLevel : S.level;
  return `<div class="stack" style="text-align:center;gap:8px;padding-top:20px">
      <div class="pts"><div class="n ${S.won ? "" : "zero"}">${S.won ? "🏆" : reached}</div></div>
      <h1 style="margin:0">${S.won ? "Every train on time" : "The trains are late"}</h1>
      <p class="muted">${S.won ? "Swiss precision achieved. The railway timetable is proud of you." : `You made it to level ${reached} of ${S.maxLevel}. Not very Swiss.`}</p></div>
    <button class="big" id="againPrec">Play again</button>
    <button class="ghost" id="lobbyBtn">Back to the lobby</button>`;
}
// With uneven teams (say 4 Swiss vs 2 Aussies) scores are shown as the share of answers each team got right.
function uneven() { const z = S.tsize; return !!(z && z.ch && z.au && z.ch !== z.au); }
function tRate(k) { const z = S.tsize, done = Math.max(1, (S.qhist || []).length); return z && z[k] ? S.tscore[k] / (z[k] * done) : 0; }
function tShow(k) { return uneven() ? Math.round(tRate(k) * 100) + "%" : (S.tscore || {})[k] || 0; }
function teamBar() {
  return `<div class="teambar"><span class="tm ch">${FLAG_CH} <b>${tShow("ch")}</b></span><span class="label">Question ${S.qn + 1} of ${S.qtotal}</span><span class="tm au"><b>${tShow("au")}</b> ${FLAG_AU}</span></div>`;
}
function qTag(q) { return `<span class="qtag ${q.c}">${q.c === "au" ? FLAG_AU + " Aussie question" : FLAG_CH + " Swiss question"}</span>`; }
function qqHtml() {
  const q = curQ(), order = optOrder(S.game, S.qn);
  return `${teamBar()}
    <div class="qcard">${qTag(q)}<h2>${esc(q.q)}</h2></div>
    <div class="opts">${order.map(i => `<button class="opt" data-a="${i}">${esc(q.a[i])}</button>`).join("")}</div>
    <p class="muted small" id="waitNote" style="text-align:center"></p>
    <button class="link" id="revealNow">Show the answer now</button>`;
}
function qrHtml() {
  const q = curQ(), order = optOrder(S.game, S.qn), h = S.qhist[S.qhist.length - 1];
  const right = h.right.map(id => `<span class="pchip ready"><span class="f">${pflag(id)}</span>${esc(pname(id))}</span>`).join("");
  return `${teamBar()}
    <div class="qcard">${qTag(q)}<h2>${esc(q.q)}</h2></div>
    <div class="opts">${order.map(i => `<div class="opt ${i === 0 ? "right" : "wrong"} ${i !== 0 && myAns(myId) === i ? "mine" : ""}">${i === 0 ? "✓ " : myAns(myId) === i ? "✗ " : ""}${esc(q.a[i])}</div>`).join("")}</div>
    <div class="note">${esc(q.f)}</div>
    <div class="stack" style="gap:8px"><span class="label">Got it right</span><div class="players">${right || '<span class="muted">Nobody. Brutal.</span>'}</div></div>
    <button class="big" id="nextQBtn">${S.qn + 1 >= S.qtotal ? "Final score" : "Next question"}</button>`;
}
function qendHtml() {
  const t = uneven() ? { ch: tRate("ch"), au: tRate("au") } : S.tscore, win = t.ch === t.au ? null : t.ch > t.au ? "ch" : "au";
  const title = win === "ch" ? "Switzerland wins!" : win === "au" ? "Australia wins!" : "It's a draw";
  const sub = win === "ch" ? "Precise, neutral and smug about it. Huere guet." : win === "au" ? "Fair dinkum legends. Shoeys all round." : "Perfectly neutral. Very Swiss of you all.";
  const best = {}; S.qhist.forEach(h => h.right.forEach(id => best[id] = (best[id] || 0) + 1));
  const mvp = Object.keys(best).sort((a, b) => best[b] - best[a])[0];
  return `<div class="stack" style="text-align:center;gap:8px;padding-top:10px">
      <div style="font-size:64px;line-height:1">${win === "au" ? FLAG_AU : win === "ch" ? FLAG_CH : FLAG_CH + " " + FLAG_AU}</div>
      <h1 style="margin:0">${title}</h1><p class="muted">${sub}</p></div>
    <div class="teambar big"><span class="tm ch">${FLAG_CH} <b>${tShow("ch")}</b></span><span class="label">${uneven() ? "right" : "final"}</span><span class="tm au"><b>${tShow("au")}</b> ${FLAG_AU}</span></div>
    ${uneven() ? `<p class="muted small" style="text-align:center">Uneven teams (${S.tsize.ch} Swiss, ${S.tsize.au} Aussie${S.tsize.au === 1 ? "" : "s"}), so it's the share of answers each team got right.</p>` : ""}
    ${mvp ? `<div class="note">Smartest drunk: <b>${esc(pname(mvp))}</b> with ${best[mvp]} right.</div>` : ""}
    <button class="big" id="againQuiz">Rematch</button>
    <button class="ghost" id="lobbyBtn">Back to the lobby</button>`;
}
function bindPhase(phase, amGiver) {
  if (phase === "lobby") {
    const qr = $("#qr");
    try { new QRCode(qr, { text: joinUrl(), width: 264, height: 264, correctLevel: QRCode.CorrectLevel.M }); } catch (e) { qr.textContent = "QR unavailable"; }
    $("#copyBtn").onclick = () => { navigator.clipboard.writeText(joinUrl()).then(() => toast("Link copied"), () => toast(joinUrl())); };
    $("#startDial").onclick = startGame;
    $("#startQuiz").onclick = startQuiz;
    $("#startPrec").onclick = startPrec;
    $("#startNeutral").onclick = startNeutral;
    $("#startSecrets").onclick = startSecrets;
    $("#startMost").onclick = () => startMost(false);
    $("#startSpicy").onclick = () => startMost(true);
    $("#startKids").onclick = () => startMost(false, true);
  }
  if (phase === "pp" && $("#playBtn")) $("#playBtn").onclick = precPlay;
  if (phase === "pl") $("#precNextBtn").onclick = precNext;
  if (phase === "pend") { $("#againPrec").onclick = startPrec; $("#lobbyBtn").onclick = toLobby; }
  if (phase === "qq") document.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.a));
  if ($("#revealNow")) {
    let armed = false; const btn = $("#revealNow"), label = btn.textContent;
    const act = { qq: revealQ, mv: revealMost, np: resolveRound, nv: resolveVote, sq: revealSecret }[phase];
    btn.onclick = () => { if (!armed) { armed = true; btn.textContent = "Tap again to show it"; setTimeout(() => { armed = false; if (btn.isConnected) btn.textContent = label; }, 3000); } else act(); };
  }
  if (phase === "np") {
    document.querySelectorAll(".copt").forEach(b => b.onclick = () => pickCrossing(+b.dataset.c));
    const pk = $("#peek");
    if (pk) {
      const open = e => { e.preventDefault(); pk.classList.add("open"); }, shut = () => pk.classList.remove("open");
      pk.addEventListener("pointerdown", open); ["pointerup", "pointerleave", "pointercancel"].forEach(t => pk.addEventListener(t, shut));
      pk.addEventListener("contextmenu", e => e.preventDefault());
    }
  }
  if (phase === "sq") {
    document.querySelectorAll(".sopt").forEach(b => b.onclick = () => spAnswer({ yes: b.dataset.yes === "1" }));
    document.querySelectorAll(".gopt").forEach(b => b.onclick = () => spAnswer({ guess: +b.dataset.g }));
  }
  if (phase === "sr") $("#nextSecretBtn").onclick = nextSecret;
  if (phase === "send") { $("#againSecrets").onclick = startSecrets; $("#lobbyBtn").onclick = toLobby; }
  if (phase === "nx") $("#ngNextBtn").onclick = neutralNext;
  if (phase === "nv") document.querySelectorAll(".vopt").forEach(b => b.onclick = () => castNVote(b.dataset.id));
  if (phase === "nend") { $("#againNeutral").onclick = startNeutral; $("#lobbyBtn").onclick = toLobby; }
  if (phase === "mv") document.querySelectorAll(".vopt").forEach(b => b.onclick = () => vote(b.dataset.id));
  if ((phase === "mv" || phase === "mr") && $("#sayBtn")) $("#sayBtn").onclick = () => sayIt(phase === "mv" ? `Who is most likely to ${curMost()}?` : `${$("#winName").textContent}! Most likely to ${curMost()}!`);
  if (phase === "mr") $("#nextMostBtn").onclick = nextMost;
  if (phase === "mend") { $("#againMost").onclick = () => startMost(S.spicy, S.kids); $("#lobbyBtn").onclick = toLobby; }
  if (phase === "qr") $("#nextQBtn").onclick = nextQ;
  if (phase === "qend") { $("#againQuiz").onclick = startQuiz; $("#lobbyBtn").onclick = toLobby; }
  if (phase === "guess") {
    if (amGiver) $("#newCardBtn").onclick = newCard;
    else {
      bindDrag($("#dial"));
      $("#lockBtn").onclick = lockIn;
      $("#takeover").onclick = takeOver;
    }
  }
  if (phase === "reveal") $("#nextBtn").onclick = nextRound;
  if (phase === "end") { $("#againBtn").onclick = startGame; $("#lobbyBtn").onclick = toLobby; }
}

// Reloading the page (or the phone dropping it) puts you straight back in your game
if (room && store.get("hs_joined", null, true) === room && profile.name && profile.flag && typeof mqtt !== "undefined") { joined = true; connect(); keepAwake(); }
render();
if (typeof mqtt === "undefined") toast("Couldn't load the sync library. Check your internet connection.");
</script>
</body>
</html>
