<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snake Catcha</title>
<style>

  .big { font-size: 30px; font-weight: bold; border-radius: 24px; padding: 14px 30px; background: #ffd23f; box-shadow: 0 5px 0 #c89b00; }
  .big:active { transform: translateY(4px); box-shadow: 0 1px 0 #c89b00; }
  .big.green { background: #7bd66b; box-shadow: 0 5px 0 #3f9a35; }

  /* start card */
  #start .sheet { text-align: center; align-items: center; padding: 24px 30px 30px; gap: 12px; width: min(760px, 92vw); }

  /* battle */
  #battle { background: #9fd3f0; }
  #bcv { position: absolute; inset: 0; width: 100%; height: 100%; }

  #foe .sub { font-size: 19px; color: #5b6b5e; }
  .tier { display: inline-block; font-size: 18px; font-weight: bold; color: #fff; border-radius: 12px; padding: 2px 12px; margin-right: 6px; vertical-align: middle; }
  .pips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; max-width: 360px; }

  #qpanel { position: absolute; right: 18px; bottom: 18px; width: min(610px, 54vw); background: rgba(255,255,255,.96); border-radius: 28px; padding: 16px 20px 16px; box-shadow: 0 6px 0 rgba(0,0,0,.22); text-align: center; }
  #qtime { height: 14px; border-radius: 7px; background: #e6e6e6; overflow: hidden; margin-bottom: 8px; }

  #qans { display: flex; gap: 14px; justify-content: center; margin: 12px 0 10px; }

  .wcard .e { font-size: 19px; color: #7a877c; }
  .wcard.lit { border-color: #ffb300; transform: scale(1.06); background: #fff6d6; }

  .say-btn { font-size: 30px; font-weight: bold; border-radius: 24px; padding: 12px 30px; background: #c9b8ff; box-shadow: 0 5px 0 #8a72d6; }

  /* the 🍓 shop */
  #shop { background: #ffe9c2; }

  .shophead { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 22px; font-weight: bold; }

  #sLevel { color: #f2b600; letter-spacing: 2px; }
  #sLeave { font-size: 22px; font-weight: bold; border-radius: 16px; padding: 8px 16px; background: #e8f3ff; box-shadow: 0 4px 0 #9fb7d0; }
  #sPrompt { font-size: 28px; font-weight: bold; margin: 14px 0 10px; min-height: 36px; }
  #sSlots { display: flex; gap: 10px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }

  #sSlots .slot.lock { border-style: solid; border-color: #43a047; background: #e2f7df; }

  #sTiles { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
  #sTiles .tile { width: 70px; height: 74px; border-radius: 16px; background: #ffe9a8; box-shadow: 0 5px 0 #d6b44a; font-size: 44px; font-weight: bold; color: #1f3b26; }
  #sTiles .tile:active { transform: translateY(4px); box-shadow: 0 1px 0 #d6b44a; }
  #sTiles .tile.used { visibility: hidden; }

  /* books */
  .grouphead { font-size: 26px; font-weight: bold; margin: 16px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .scard { background: #fff; border-radius: 20px; border: 3px solid #e3eadf; padding: 8px; text-align: center; }
  .scard canvas { width: 100%; height: 80px; }
  .scard .n { font-size: 19px; font-weight: bold; line-height: 1.15; }
  .scard .m { font-size: 16px; color: #6b7a6e; }
  .scard.no { background: #f1f1ec; color: #9a9f98; }
  .tabs { display: flex; gap: 10px; padding: 0 22px 6px; }
  .tabs button { font-size: 24px; font-weight: bold; padding: 8px 18px; border-radius: 18px; background: #eef2ea; }
  .tabs button.on { background: #ffd23f; }
  .wchip { background: #fff; border: 3px solid #e3eadf; border-radius: 18px; padding: 8px; text-align: center; }
  .wchip .pic { font-size: 44px; min-height: 52px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; }
  .wchip .pic.dots { font-size: 15px; }
  .wchip .sw { width: 46px; height: 46px; border-radius: 50%; border: 3px solid rgba(0,0,0,.15); }
  .wchip .w { font-size: 21px; font-weight: bold; }
  .wchip .e { font-size: 15px; color: #7a877c; }
  .wchip.no { opacity: .35; }
  .wordgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .places { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  .places button { background: #fff; border: 4px solid #e3eadf; border-radius: 24px; padding: 16px 8px; font-size: 26px; font-weight: bold; }
  .places button .f { font-size: 64px; display: block; }
  .places button .c { font-size: 18px; color: #6b7a6e; display: block; }
  .places button.here { border-color: #ffb300; background: #fff6d6; }
  .setrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 12px 0; font-size: 22px; }
  .setrow b { min-width: 230px; }
  .setrow button { font-size: 20px; padding: 8px 16px; border-radius: 14px; background: #eef2ea; }
  .setrow button.on { background: #ffd23f; font-weight: bold; }
  .note { font-size: 17px; color: #6b7a6e; line-height: 1.4; }
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="place"></div>
<div class="hud">
  <button id="bookBtn">🐍 <span id="nCaught">0</span></button>
  <button id="wordsBtn">💬 <span id="nWords">0</span></button>
  <div class="pill">🍓 <span id="nBerry">0</span></div>
  <div class="pill">💡 <span id="nHint">0</span></div>
</div>
<div class="pad" id="pad">
  <button class="u" data-d="up">⬆️</button><button class="l" data-d="left">⬅️</button>
  <button class="r" data-d="right">➡️</button><button class="d" data-d="down">⬇️</button>
</div>

<!-- start -->
<div id="start" class="overlay dim show"><div class="sheet">
  <canvas id="logo" width="300" height="200" style="width:300px;height:200px"></canvas>
  <h1>Snake Catcha</h1>
  <p>Help Catcha the cockatoo catch snakes!<br>Walk in the long grass to find them, and answer the maths to catch them.</p>

</div></div>

<!-- battle -->
<div id="battle" class="overlay">
  <canvas id="bcv"></canvas>

    <div id="qtime"><i></i></div>
    <div id="qtext"></div><div id="qdots"></div><div id="qask"></div>

    <div class="tools" id="tools"><button id="useBerry">🍓 <span></span></button><button id="useHint">💡 <span></span></button><button id="qsay">🔈</button><button id="run">🏃 Run</button></div>
  </div>

<script>
'use strict';
/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const today = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
const wait = ms => new Promise(r => setTimeout(r, ms));
const Cap = (parent !== window && parent.Capacitor) || window.Capacitor || null;

/* ================= save ================= */
const KEY = 'snake-catcha';
const DEF = { place: 'home', x: 4, y: 3, dir: 'down', caught: {}, berries: 2, hints: 2, words: {}, gifts: {}, giftN: {}, met: {},
  set: { level: 2, time: 20, rate: 1, shopCap: 10, spell: 0 } };
const S = (() => { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) return Object.assign(JSON.parse(JSON.stringify(DEF)), s, { set: Object.assign({}, DEF.set, s.set) }); } catch (e) {} return JSON.parse(JSON.stringify(DEF)); })();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

/* ================= speech (the games page around this frame has the tablet's voice) ================= */
const speechWin = 'speechSynthesis' in window ? window : (parent !== window && parent.speechSynthesis ? parent : null);
let sayTok = 0;
function voiceFor(lang) {
  const vs = speechWin && speechWin.speechSynthesis.getVoices ? speechWin.speechSynthesis.getVoices() : [];
  const l = lang.toLowerCase(), norm = v => (v.lang || '').replace('_', '-').toLowerCase();
  return vs.find(v => norm(v) === l) || vs.find(v => norm(v).startsWith(l.slice(0, 2))) || null;
}
function hush() { sayTok++; if (speechWin) try { speechWin.speechSynthesis.cancel(); } catch (e) {} }
function sayMore(text, lang = 'en-AU') {
  const tok = sayTok;
  return new Promise(res => {
    if (!speechWin || !text) return res();
    const u = new speechWin.SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = lang.startsWith('en') ? 1 : 0.85; u.pitch = 1;
    const v = voiceFor(lang); if (v) u.voice = v;
    let done = false;

let ac = null;
function beep(f, dur = .12, type = 'sine', vol = .15, when = 0) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + when;
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}

/* ================= drawing: shapes ================= */
function ell(g, x, y, rx, ry, fill, stroke) { g.beginPath(); g.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), 0, 0, Math.PI * 2); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.stroke(); } }

  const px = mx + mw * .7, pw = mw * .25;
  rrect(g, px, gy, pw, pw, 10, '#13202a', '#000');
  if (SH.word) { const pop = Math.min(1, (now - SH.revealT) / 300); g.font = `${pw * .62 * pop}px sans-serif`; g.fillText(SH.word.pic, px + pw / 2, gy + pw / 2 + 2); }
  else { g.fillStyle = '#5cff8a'; g.font = `bold ${pw * .35}px monospace`; g.fillText(left ? '?' : '0', px + pw / 2, gy + pw / 2); }
  for (let k = 0; k < 9; k++) rrect(g, px + pw * (.08 + (k % 3) * .32), gy + pw * 1.12 + Math.floor(k / 3) * pw * .3, pw * .24, pw * .22, 4, '#eceff1', '#90a4ae');
  rrect(g, px + pw * .3, gy + pw * 2.1, pw * .4, pw * .5, 6, '#263238'); g.fillStyle = '#90a4ae'; g.fillRect(px + pw * .47, gy + pw * 2.18, pw * .06, pw * .34);
  // chute
  const cx0 = gx, cy0 = my + mh * .74, cw = gw, ch = mh * .17;
  rrect(g, cx0, cy0, cw, ch, 12, '#3a1010', '#000');
  rrect(g, cx0 + 8, cy0 + 8, cw - 16, ch * .35, 8, 'rgba(255,255,255,.12)');
  // the animation: coin in (0–400), spiral turns (400–1200), strawberry drops (1200–1700), flies to the counter (1900–2500)
  if (an) {
    if (ae < 400) { const k = ae / 400; ell(g, px + pw / 2, gy + pw * 2.35 - (1 - k) * 60, 14, 14 * (1 - k * .6), '#ffd23f', '#b8860b'); }
    if (ae >= 400 && ae < 420 && !an.whirr) { an.whirr = 1; beep(120, .7, 'sawtooth', .04); }
    const slotX = gx + gw * (.18 + (an.slot % 3) * .32), slotY = gy + gh * (.28 + Math.floor(an.slot / 3) * .32);
    const restX = cx0 + cw / 2, restY = cy0 + ch * .6;
    if (ae >= 1200 && ae < 1700) { const k = (ae - 1200) / 500; drawBerry(g, slotX + (restX - slotX) * k, slotY + (restY - slotY) * k * k, gh * .095, k * 4); }
    if (ae >= 1700 && !an.thud) { an.thud = 1; beep(160, .1, 'sine', .2); for (let i = 0; i < 10; i++) SH.sparks.push({ x: restX, y: restY, vx: (Math.random() - .5) * 300, vy: -Math.random() * 250, life: 0, max: .7 }); }
    if (ae >= 1700 && ae < 1900) drawBerry(g, restX, restY - Math.sin((ae - 1700) / 200 * Math.PI) * 14, gh * .095);
    if (ae >= 1900) {
      const el = $('sToday').getBoundingClientRect(), tx = el.left + 30, ty = el.top + el.height / 2, k = Math.min(1, (ae - 1900) / 600);
      if (k < 1) drawBerry(g, restX + (tx - restX) * ease(k), restY + (ty - restY) * ease(k) - Math.sin(k * Math.PI) * H * .2, gh * .095 * (1 - k * .4), k * 6);
      else if (!an.done) {
        an.done = 1; S.berries++; spellState().earned++; save(); hud(); shopHud(); sfx.caught();
        $('sToday').classList.remove('pop'); void $('sToday').offsetWidth; $('sToday').classList.add('pop');
        setTimeout(() => { if (!SH) return; SH.anim = null; if (shopLeft()) nextWord(); else soldOut(); }, 700);
      }
    }
  }
  SH.sparks = SH.sparks.filter(p => (p.life += dt) < p.max);
  for (const p of SH.sparks) { p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; star4(g, p.x, p.y, 9 * (1 - p.life / p.max), p.life * 6, '#ffd23f'); }
  // Catcha watching, bobbing when a strawberry comes out
  const hop = an && ae > 1700 && ae < 2600 ? Math.abs(Math.sin((ae - 1700) / 150)) * 20 : 0;
  drawBird(g, port ? W * .82 : mx + mw + W * .05, port ? my + mh * .98 : fy + H * .1, port ? H * .14 : H * .24, port ? 'left' : 'left', 0, CATCHA, { air: hop, crest: hop ? 1.5 : 1, blink: (clock % 3) < .12 });
}

/* ================= books ================= */
function closeSheets() { document.querySelectorAll('#book,#words,#travel,#settings').forEach(o => o.classList.remove('show')); hush(); if (mode === 'menu') mode = 'walk'; }
document.querySelectorAll('.sheet .x').forEach(b => b.onclick = closeSheets);
function openSheet(id) { if (mode !== 'walk') return false; mode = 'menu'; held = null; padOff(); path = []; $(id).classList.add('show'); return true; }
$('infoX').onclick = e => { e.stopPropagation(); hush(); $('info').classList.remove('show'); };
$('bookBtn').onclick = () => {
  if (!openSheet('book')) return;
  const body = $('bookBody'); body.innerHTML = '';
  for (const key of ORDER) {
    const pl = PLACES[key], ids = pl.snakes;
    const got = pl.snakes.filter(id => S.caught[id]).length;
    body.insertAdjacentHTML('beforeend', `<div class="grouphead">${pl.flag} ${pl.name} — ${got} of ${pl.snakes.length}</div>`);
    const grid = document.createElement('div'); grid.className = 'grid'; body.appendChild(grid);
    for (const id of ids) {
      const sp = SNAKES[id], c = S.caught[id], card = document.createElement('div');
      card.className = 'scard' + (c ? '' : ' no');
      card.innerHTML = `<canvas width="380" height="160"></canvas><div class="n">${c ? sp.name : '???'}</div><div class="m"><span class="tier" style="background:${TIERS[sp.tier].col}">${TIERS[sp.tier].name}</span>${c ? `<span style="font-size:15px">${drops(sp.venom)}</span><br>×${c.n} · ${lenShort(c.best)}` : ''}</div>`;
      grid.appendChild(card);
      const g = card.querySelector('canvas').getContext('2d'); g.scale(2, 2);
      const shadow = c ? sp : { ...sp, c1: '#c9ccc4', c2: '#b9bdb3', c3: null, belly: '#d6d8d1', headCol: null, collar: null, tail: null, pat: 'plain', eye: '#c9ccc4' };
      drawSnake(g, 95, 45, 120, 13 + sp.tier * 2, shadow, 1.1, { tongue: !!c, flat: true });
      card.onclick = () => openInfo(id);
    }
  }
};
const metres = cm => cm >= 100 ? `${(cm / 100).toFixed(1).replace('.0', '')} m` : `${cm} cm`;
const PUPILS = { round: 'Round pupils', slit: 'Up-and-down pupils, like a cat', keyhole: 'Sideways keyhole pupils', tiny: 'Tiny eyes under its scales' };
function openInfo(id) {
  const sp = SNAKES[id], c = S.caught[id], where = placesOf(id);
  const shadow = c ? sp : { ...sp, c1: '#c9ccc4', c2: '#b9bdb3', c3: null, belly: '#d6d8d1', headCol: null, collar: null, tail: null, pat: 'plain', eye: '#c9ccc4' };
  $('infoBody').innerHTML = `<canvas id="infoCv" width="1200" height="420"></canvas>
    <h2>${c ? sp.name : '??? Not caught yet'}</h2><div class="sci">${c ? sp.sci : ''}</div>
    <div class="facts">
      <b>Size</b><span><span class="tier" style="background:${TIERS[sp.tier].col}">${TIERS[sp.tier].name}</span> grows to ${metres(sp.cm[0])} – ${metres(sp.cm[1])}</span>
      <b>Lives in</b><span>${where.map(k => `${PLACES[k].flag} ${PLACES[k].name}`).join(', ')}</span>
      <b>Habitat</b><span>${sp.hab.map(h => HAB_WORD[h]).join(', ')}</span>
      ${c ? `<b>Venom</b><span>${drops(sp.venom)} <b style="color:${VENOM[sp.venom].c}">${VENOM[sp.venom].t}.</b> ${VENOM[sp.venom].say}</span>
      <b>Fangs</b><span>${FANGS[sp.fangs]}</span>
      <b>Eyes</b><span>${PUPILS[sp.pupil]}${sp.head === 'lizard' ? ', with eyelids' : ''}</span>
      <b>Eats</b><span>${sp.eats}</span>
      ${sp.local ? `<b>Called</b><span>${Object.entries(sp.local).map(([l, w]) => `${LANGS[l].flag} ${w}`).join(' · ')}</span>` : ''}
      <b>You caught</b><span>${c.n} · longest ${lenShort(c.best)}</span>` : `<b>Find it</b><span>Look ${habWhere(sp.hab[0], where[0])} in ${PLACES[where[0]].name}!</span>`}
    </div>
    ${c ? `<div class="fact">${sp.fact}</div>` : ''}`;
  const g = $('infoCv').getContext('2d'); g.scale(2, 2);
  drawSnake(g, 300, sp.head === 'cobra' ? 150 : 115, 230 + sp.tier * 40, Math.min(sp.head === 'cobra' ? 30 : 44, 18 + sp.tier * 5), shadow, 1.2, { mouth: c ? .9 : 0, tongue: false });
  $('info').classList.add('show');
  if (c) sayAll([[sp.name, 'en-AU'], [`${VENOM[sp.venom].t}. ${FANGS[sp.fangs]}`, 'en-AU'], [sp.fact, 'en-AU']]);
  else say(`Not caught yet. Look ${habWhere(sp.hab[0], where[0])} in ${PLACES[where[0]].name}.`);
}

let wordTab = 'nl';
$('wordsBtn').onclick = () => { if (openSheet('words')) renderWords(); };
function renderWords() {
  $('wordTabs').innerHTML = Object.entries(LANGS).map(([k, l]) => `<button data-k="${k}" class="${k === wordTab ? 'on' : ''}">${l.flag} ${l.name}</button>`).join('');
  [...$('wordTabs').children].forEach(b => b.onclick = () => { wordTab = b.dataset.k; renderWords(); });
  const known = S.words[wordTab] || {}, voice = LANGS[wordTab].voice;
  $('wordsBody').innerHTML = Object.entries(TOPICS).map(([tk, T]) => `<div class="grouphead">${T.icon} ${T.en}</div><div class="wordgrid">${topicWords(tk, wordTab).map(w => known[w.w]
    ? `<button class="wchip" data-w="${w.w.replace(/"/g, '&quot;')}">${picHtml(w.p)}<div class="w">${w.w}</div></button>`
    : `<div class="wchip no">${picHtml(w.p)}<div class="w">?</div></div>`).join('')}</div>`).join('') +
    `<p class="note" style="margin-top:14px">Talk to people in ${wordTab === 'nl' ? 'the Netherlands' : wordTab === 'fr' ? 'France' : 'Switzerland'} to learn more words.</p>`;
  $('wordsBody').querySelectorAll('button.wchip').forEach(b => b.onclick = () => say(b.dataset.w, voice));
}

/* ================= travel ================= */
function openTravel() {
  if (!openSheet('travel')) return;
  $('travelTitle').textContent = `${place.ride} Where shall we go?`;
  $('places').innerHTML = ORDER.map(k => { const pl = PLACES[k], got = pl.snakes.filter(id => S.caught[id]).length;
    return `<button data-k="${k}" class="${k === S.place ? 'here' : ''}"><span class="f">${pl.flag}</span>${pl.name}<span class="c">🐍 ${got} of ${pl.snakes.length}${k === S.place ? ' · you are here' : ''}</span></button>`; }).join('');
  [...$('places').children].forEach(b => b.onclick = () => {
    const k = b.dataset.k; closeSheets();
    if (k === S.place) return;
    const pl = PLACES[k];
    enterPlace(k, pl.start[0], pl.start[1]); P.dir = 'down';
    say(k === 'home' ? 'Home again!' : `Welcome to ${pl.name}!`);
  });
  say('Where shall we go?');
}

/* ================= grown-ups (hold ⚙️) ================= */
let gearT = null;
$('gear').addEventListener('pointerdown', () => { if (mode !== 'walk') return; const f = $('gear').firstChild; f.style.transition = 'height 1.5s linear'; f.style.height = '100%'; gearT = setTimeout(openSettings, 1500); });
const gearUp = () => { clearTimeout(gearT); const f = $('gear').firstChild; f.style.transition = 'none'; f.style.height = '0'; };
['pointerup', 'pointercancel', 'pointerleave'].forEach(e => $('gear').addEventListener(e, gearUp));
function openSettings() {
  gearUp(); if (!openSheet('settings')) return;
  const row = (label, key, opts) => `<div class="setrow"><b>${label}</b>${opts.map(([v, t]) => `<button data-k="${key}" data-v="${v}" class="${S.set[key] === v ? 'on' : ''}">${t}</button>`).join('')}</div>`;
  $('setBody').innerHTML =
    row('Maths', 'level', [[-1, 'Easiest'], [0, 'Easy'], [1, 'Medium'], [2, 'Harder'], [3, 'Hardest']]) +
    `<p class="note">Tiny snakes ask the easiest questions and giant snakes the hardest. Right now: ${TIERS.map((t, i) => `${t.name.toLowerCase()} = ${LEVEL_WORDS[clamp(i + S.set.level, 0, 7)]}`).join('; ')}.</p>` +
    row('Time for each question', 'time', [[0, 'No timer'], [30, '30 s'], [20, '20 s'], [12, '12 s']]) +
    row('Snakes in the long grass', 'rate', [[.6, 'Fewer'], [1, 'Normal'], [1.6, 'More']]) +
    row('🍓 shop: strawberries a day', 'shopCap', [[5, '5'], [10, '10'], [20, '20'], [999, 'No limit']]) +
    row('🍓 shop: spelling', 'spell', [[0, `Auto (now ${'⭐'.repeat(spellState().level)})`], [1, '3 letters'], [2, '4 letters'], [3, '5+ letters']]) +
    `<div class="setrow"><b>Voices</b><span id="voiceState" class="note">Checking…</span></div>` +
    `<div class="setrow"><b>Give</b><button id="giveB">+3 🍓</button><button id="giveH">+3 💡</button></div>` +
    `<div class="setrow"><b>Start again</b><button id="resetAll">Clear all snakes and words</button></div>` +
    `<p class="note">Caught ${Object.keys(S.caught).length} of ${Object.keys(SNAKES).length} kinds of snake. Learned ${$('nWords').textContent} words.</p>`;
  $('setBody').querySelectorAll('button[data-k]').forEach(b => b.onclick = () => { S.set[b.dataset.k] = +b.dataset.v; save(); openSettingsRefresh(); });
  $('giveB').onclick = () => { S.berries += 3; save(); hud(); };
  $('giveH').onclick = () => { S.hints += 3; save(); hud(); };
  $('resetAll').onclick = () => { if (!confirm('Clear all caught snakes and learned words?')) return; const set = S.set; Object.keys(S).forEach(k => delete S[k]); Object.assign(S, JSON.parse(JSON.stringify(DEF)), { set }); save(); closeSheets(); enterPlace('home', ...PLACES.home.first); };
  checkVoices();
}
function openSettingsRefresh() { mode = 'walk'; $('settings').classList.remove('show'); openSettings(); }
async function checkVoices() {
  const el = $('voiceState'), tags = ['nl-NL', 'fr-FR', 'de-CH', 'de-DE'];
  let have = null;
  if (Cap && Cap.nativePromise) { try { have = (await Cap.nativePromise('Speech', 'langs', { langs: tags })).langs; } catch (e) { have = null; } }
  if (!have && speechWin && speechWin.speechSynthesis.getVoices) { const vs = speechWin.speechSynthesis.getVoices(); if (vs.length) have = Object.fromEntries(tags.map(t => [t, !!voiceFor(t) && voiceFor(t).lang.toLowerCase().startsWith(t.slice(0, 2))])); }
  if (!el) return;
  if (!have) { el.textContent = 'Can\'t check the voices here.'; return; }
  const st = t => ({ true: 'installed', false: 'none' })[have[t]] || have[t];
  const ICON = { installed: '✅', online: '🌐 online only', download: '⬇️ not downloaded', none: '❌' };
  const de = st('de-CH') === 'installed' ? 'installed' : st('de-DE');
  el.innerHTML = `Dutch ${ICON[st('nl-NL')]} · French ${ICON[st('fr-FR')]} · German ${ICON[de]}<br>(Swiss German words are read by a German voice.)` +
    ([st('nl-NL'), st('fr-FR'), de].some(x => x !== 'installed') ? '<br>To add a voice on the tablet: Settings → General management → Text-to-speech → ⚙️ next to Speech Services by Google → Install voice data → Dutch, French, German.' : '');
}

/* ================= start ================= */
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 1.5); W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  TS = Math.round(clamp(H > W ? W / 9 : Math.min(H / 9.5, W / 13), 48, 110));
  cache = {}; if (B) resizeBattle();
}
addEventListener('resize', resize);
resize();
if (!PLACES[S.place]) S.place = 'home';
enterPlace(S.place, S.x, S.y); P.dir = S.dir || 'down';
if (!canWalk(P.x, P.y) && tileAt(P.x, P.y) !== 'P') { const pl = PLACES[S.place]; enterPlace(S.place, pl.start[0], pl.start[1]); }
(function logo() { const g = $('logo').getContext('2d'); g.scale(1, 1); drawSnake(g, 212, 125, 150, 20, SNAKES.diamond, .8); drawBird(g, 70, 190, 150, 'right', 0, CATCHA); })();
$('play').onclick = () => {
  $('start').classList.remove('show'); mode = 'walk'; beep(660, .08, 'triangle');
  const first = !Object.keys(S.met).length && !Object.keys(S.caught).length;
  say(first ? 'Hi Catcha! Go and say hello to Kooka.' : `Let's catch some snakes!`);
};
requestAnimationFrame(frame);
</script>
