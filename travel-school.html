<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Travel School</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: manipulation; background: #fff8ec; color: #333; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; overflow-y: auto; padding: 16px 16px 100px; }
  .screen.active { display: flex; }
  .head { width: 100%; display: flex; align-items: center; gap: 16px; padding-left: 96px; min-height: 80px; } /* 🏠 from the games page sits top left */
  .head h1 { margin: 0; font-size: 38px; flex: 1; }
  .round { border: none; border-radius: 50%; width: 72px; height: 72px; font-size: 34px; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,.15); flex: none; }
  .round:active, .big:active, .chip:active { transform: translateY(3px); }
  .row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; padding: 12px; }
  .big { border: none; border-radius: 28px; font-size: 30px; padding: 22px 30px; color: #fff; box-shadow: 0 7px 0 rgba(0,0,0,.18); min-width: 220px; min-height: 80px; }
  .big .emoji { display: block; font-size: 80px; line-height: 1.1; }
  .big.small { min-width: 0; font-size: 26px; padding: 14px 24px; }
  .big:disabled { background: #c9c3b8 !important; opacity: .7; }
  .c1 { background: #3d8bfd; } .c2 { background: #ff9f1c; } .c3 { background: #2ec4b6; } .c4 { background: #8e6cff; } .c5 { background: #ef476f; } .c6 { background: #43aa8b; }
  .gear { position: fixed; bottom: 16px; right: 16px; border: none; background: none; font-size: 34px; opacity: .45; overflow: hidden; border-radius: 50%; width: 64px; height: 64px; z-index: 30; }
  .gear .fill { position: absolute; left: 0; bottom: 0; width: 100%; height: 0; background: rgba(0,0,0,.15); }
  .say { font-size: 30px; }
  .w.on { background: #ffe066; border-radius: 6px; }
  .readable .w { padding: 0 2px; }

  /* Passport strip */
  .passport { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin: 8px 0 4px; }
  .pp { background: #fff; border-radius: 20px; padding: 8px 14px; box-shadow: 0 3px 8px rgba(0,0,0,.1); display: flex; align-items: center; gap: 8px; font-size: 24px; border: 3px solid transparent; }
  .pp .flag { font-size: 40px; }
  .pp.here { border-color: #ffd43b; }
  .pp b { min-width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 20px; }

  /* Recount steps */
  .steps { display: flex; gap: 10px; }
  .step { width: 64px; height: 64px; border-radius: 50%; border: 4px solid #ddd; background: #fff; font-size: 30px; display: grid; place-items: center; }
  .step.on { border-color: #3d8bfd; box-shadow: 0 0 0 4px #cfe2ff; }
  .step.done { background: #d3f9d8; border-color: #51cf66; }
  .panel { display: none; width: 100%; max-width: 1100px; flex-direction: column; align-items: center; gap: 14px; }
  .panel.on { display: flex; }
  .banner { font-size: 26px; background: #fff3bf; border-radius: 16px; padding: 6px 18px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; width: 100%; }
  .card { background: #fff; border-radius: 24px; box-shadow: 0 4px 12px rgba(0,0,0,.1); padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; border: 4px solid transparent; }
  .card .icon { font-size: 64px; line-height: 1; border: none; background: none; }
  .card .word { font-size: 26px; }
  .card.got { border-color: #51cf66; }
  .card.best { border-color: #ffd43b; background: #fff9db; }
  .mini { display: flex; gap: 10px; }
  .mini button { border: none; border-radius: 50%; width: 64px; height: 64px; font-size: 30px; background: #f1f3f5; }
  .mini .rec { background: #ffe3e3; }
  .mini .rec.live { background: #ff6b6b; animation: pulse 1s infinite alternate; }
  .mini .live:not(.rec), .card .icon.live { background: #ffe066; border-radius: 50%; }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.12); } }
  .slot { width: 100%; background: #fff; border-radius: 24px; padding: 16px 20px; box-shadow: 0 4px 12px rgba(0,0,0,.08); display: flex; align-items: center; gap: 14px; border-left: 12px solid #3d8bfd; }
  .slot.grown { border-left-color: #43aa8b; }
  .slot .who { font-size: 34px; flex: none; }
  .slot .text { flex: 1; font-size: 34px; min-height: 48px; font-family: system-ui, sans-serif; }
  .slot .text:empty::before { content: "…"; color: #bbb; }
  .bigtext { font-family: system-ui, sans-serif; font-size: 46px; line-height: 1.5; background: #fff; border-radius: 24px; padding: 20px 28px; box-shadow: 0 4px 12px rgba(0,0,0,.08); width: 100%; }
  .bigtext .mine { color: #1c5fd4; } .bigtext .theirs { color: #2b8a3e; }
  .goal { font-size: 28px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .goal span { background: #fff; padding: 8px 16px; border-radius: 16px; }
  .thumbs { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .thumbs img { height: 160px; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,.2); }

  /* Chips (word tiles) */
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .chip { border: none; border-radius: 16px; padding: 12px 18px; font-size: 26px; min-height: 64px; min-width: 64px; background: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.15); font-family: system-ui, sans-serif; }
  .chip.sel { background: #ffd43b; }
  .grp { width: 100%; display: flex; gap: 12px; align-items: flex-start; }
  .grp > b { flex: none; width: 90px; font-size: 20px; color: #888; padding-top: 18px; text-align: right; }
  .g-then .chip, .g-join .chip { background: #d0ebff; }
  .g-start .chip { background: #e5dbff; } .g-feel .chip { background: #ffe8cc; } .g-end .chip { background: #ffd8a8; font-weight: bold; }

  /* Overlays */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 50; }
  .overlay.on { display: flex; }
  .sheet { background: #fff8ec; border-radius: 28px; padding: 20px; width: min(1100px, 96vw); max-height: 94vh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .line { width: 100%; min-height: 90px; background: #fff; border-radius: 18px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border: 3px dashed #ced4da; }
  .check { display: flex; gap: 14px; font-size: 22px; flex-wrap: wrap; justify-content: center; }
  .check span { background: #fff; border-radius: 14px; padding: 6px 12px; opacity: .45; }
  .check span.ok { opacity: 1; background: #d3f9d8; }
  textarea, input[type=text], select { font: 28px system-ui, sans-serif; border-radius: 14px; border: 2px solid #ced4da; padding: 10px 14px; width: 100%; user-select: text; -webkit-user-select: text; }
  #stampBox { flex-direction: column; color: #fff; text-align: center; }
  .stamp { width: 300px; height: 300px; border-radius: 50%; border: 12px dashed #fff; display: grid; place-items: center; font-size: 150px; animation: thump .6s cubic-bezier(.2,1.6,.4,1); }
  @keyframes thump { from { transform: scale(2.5) rotate(-30deg); opacity: 0; } to { transform: none; opacity: 1; } }
  #stampBox h2 { font-size: 44px; margin: 20px 0 8px; } #stampBox p { font-size: 30px; margin: 0 0 20px; }
  #cropCanvas { touch-action: none; max-width: 100%; background: #222; border-radius: 12px; }

  /* Travel Book */
  .entry { background: #fff; border-radius: 24px; box-shadow: 0 4px 12px rgba(0,0,0,.08); padding: 18px 22px; width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 10px; }
  .entry h3 { margin: 0; font-size: 28px; display: flex; gap: 12px; align-items: center; }
  .entry .bigtext { box-shadow: none; padding: 0; font-size: 34px; }
  .entry img { max-height: 70vh; max-width: 100%; width: auto; height: auto; align-self: center; object-fit: contain; border-radius: 12px; }
  .entry .stampmark { margin-left: auto; font-size: 40px; }
  .booklist { width: 100%; max-width: 1100px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .daycard { border: none; text-align: left; background: #fff; border-radius: 24px; box-shadow: 0 4px 12px rgba(0,0,0,.08); padding: 14px; display: flex; gap: 14px; align-items: center; min-height: 140px; }
  .daycard .thumb { width: 110px; height: 110px; flex: none; border-radius: 14px; object-fit: cover; background: #f1f3f5; display: grid; place-items: center; font-size: 48px; }
  .daycard b { display: block; font-size: 24px; }
  .daycard .snip { font: 20px system-ui, sans-serif; color: #555; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .daypill { border: none; border-radius: 20px; background: #fff; font-size: 24px; padding: 10px 18px; min-height: 64px; box-shadow: 0 4px 10px rgba(0,0,0,.15); flex: none; }
  #photoView img { max-width: 96vw; max-height: 94vh; object-fit: contain; border-radius: 8px; }

  /* Letter Lab */
  #trace, #wordtrace { padding: 0; overflow: hidden; }
  .tbar { position: absolute; top: 12px; left: 108px; right: 12px; display: flex; align-items: center; gap: 14px; z-index: 5; }
  .tbar .letter { font: bold 56px system-ui, sans-serif; width: 80px; text-align: center; }
  .dots { display: flex; gap: 8px; flex: 1; }
  .dots i { width: 26px; height: 26px; border-radius: 50%; background: #e9ecef; }
  .dots i.done { background: #51cf66; } .dots i.on { background: #3d8bfd; }
  .tcanvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .praise { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); font-size: 140px; pointer-events: none; display: none; z-index: 6; }
  .praise.on { display: block; animation: thump .6s; }
  .fam { min-width: 260px; }
  .fam .letters { display: block; font: 44px system-ui, sans-serif; letter-spacing: 6px; }
  .lgrid { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .lgrid button { width: 110px; height: 110px; border-radius: 24px; border: none; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,.12); font: 64px system-ui, sans-serif; position: relative; }
  .lgrid button i { position: absolute; top: 4px; right: 8px; font-size: 22px; font-style: normal; }

  /* Grown-ups */
  #parent { background: #f1f3f5; font-family: system-ui, sans-serif; user-select: text; }
  #parent .head h1 { font-family: system-ui, sans-serif; font-size: 30px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 6px 0 14px; }
  .tabs button { border: none; border-radius: 14px; padding: 12px 18px; font-size: 20px; background: #fff; }
  .tabs button.on { background: #3d8bfd; color: #fff; }
  .pbox { background: #fff; border-radius: 18px; padding: 16px 20px; width: 100%; max-width: 1000px; margin-bottom: 14px; font-size: 19px; }
  .pbox h2 { margin: 0 0 10px; font-size: 22px; }
  .pbox table { border-collapse: collapse; width: 100%; }
  .pbox td, .pbox th { padding: 6px 8px; border-bottom: 1px solid #eee; text-align: left; vertical-align: middle; }
  .pbtn { border: none; border-radius: 12px; padding: 10px 16px; font-size: 18px; background: #e7f5ff; margin: 3px; min-height: 48px; }
  .pbtn.on { background: #3d8bfd; color: #fff; }
  .pbtn.warn { background: #ffe3e3; }
  .pnote { color: #666; font-size: 16px; margin: 6px 0; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 14px 24px; border-radius: 16px; font: 20px system-ui, sans-serif; z-index: 60; display: none; max-width: 90vw; }
  .toast.on { display: block; }
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen active">
  <div class="head"><h1>🎒 Travel School</h1><button class="round" data-replay>🔊</button></div>
  <div class="passport" id="passport"></div>
  <div class="row">
    <button class="big c1" data-go="recount" data-label="My Day"><span class="emoji">🎤</span>My Day</button>
    <button class="big c4" data-go="letters" data-label="Letters"><span class="emoji">✍️</span>Letters</button>
    <button class="big c2" data-go="book" data-label="My Travel Book"><span class="emoji">📖</span>My Book</button>
  </div>
  <button class="gear" id="gear"><span class="fill"></span>⚙️</button>
</section>

<!-- MY DAY (recount): talk it → best sentence → paper → snap it -->
<section id="recount" class="screen">
  <div class="head">
    <button class="round" data-go="home">⬅️</button>
    <button class="daypill" id="dayBtn">📅</button>
    <div class="steps" id="steps">
      <button class="step" data-step="talk">🎤</button><button class="step" data-step="pick">⭐</button>
      <button class="step" data-step="write">✏️</button><button class="step" data-step="snap">📷</button>
    </div>
    <span style="flex:1"></span><button class="round" data-replay>🔊</button>
  </div>
  <div class="banner" id="variantBanner" hidden></div>

  <div class="panel" data-panel="talk">
    <div class="cards" id="promptCards"></div>
    <button class="big c3" data-next="pick">Next ▶️</button>
  </div>

  <div class="panel" data-panel="pick">
    <div class="cards" id="clipCards"></div>
    <div id="pickArea" style="width:100%;display:flex;flex-direction:column;gap:14px;align-items:center"></div>
    <button class="big c3" data-next="write">Next ▶️</button>
  </div>

  <div class="panel" data-panel="write">
    <div class="goal" id="goal"></div>
    <div class="bigtext readable" id="writeText"></div>
    <div class="row">
      <button class="round" id="writeBest">⭐</button>
      <button class="round" id="readWrite">🔊</button>
    </div>
    <div class="goal"><span>📓 ✏️ 🖍️</span><span>Capital letter</span><span>Finger spaces</span><span>Full stop</span></div>
    <button class="big c2" data-next="snap"><span class="emoji">✅</span>I did it!</button>
  </div>

  <div class="panel" data-panel="snap">
    <button class="big c5" id="snapBtn"><span class="emoji">📷</span>Snap my page</button>
    <div class="thumbs" id="snapThumbs"></div>
    <div class="row" id="doneRow" hidden>
      <button class="big small c6" id="postedBtn" hidden>📮 I posted it!</button>
      <button class="big small c2" data-go="book">📖 My Book</button>
      <button class="big small c1" data-go="home">🏠 Home</button>
    </div>
  </div>
</section>

<!-- TRAVEL BOOK: a card per day; tap one to open that day -->
<section id="book" class="screen">
  <div class="head"><button class="round" data-go="home">⬅️</button><h1>📖 My Travel Book</h1></div>
  <div id="bookList" class="booklist"></div>
</section>
<section id="day" class="screen">
  <div class="head"><button class="round" data-go="book">⬅️</button><h1 id="dayTitle"></h1></div>
  <div id="dayBody" style="width:100%;display:flex;flex-direction:column;gap:18px;align-items:center"></div>
</section>

<!-- LETTER LAB: families -->
<section id="letters" class="screen">
  <div class="head"><button class="round" data-go="home">⬅️</button><h1>✍️ Letters</h1><button class="round" data-replay>🔊</button></div>
  <button class="big c4" id="todayLetters"><span class="emoji">⭐</span><span id="todayLabel">Today</span></button>
  <div class="row" id="families"></div>
  <div class="lgrid" id="letterGrid"></div>
</section>

<!-- LETTER LAB: trace one letter -->
<section id="trace" class="screen">
  <canvas class="tcanvas" id="traceCanvas"></canvas>
  <div class="tbar">
    <button class="round" id="traceBack">⬅️</button>
    <span class="letter" id="traceLetter"></span>
    <div class="dots" id="traceDots"></div>
    <button class="round" id="traceWatch">👀</button>
    <button class="round" id="traceClear">🧽</button>
    <button class="round" id="traceSkip">⏭️</button>
  </div>
  <div class="praise" id="praise">⭐</div>
</section>

<!-- LETTER LAB: now on paper -->
<section id="paper" class="screen">
  <div class="head"><button class="round" data-go="letters">⬅️</button><h1>📓 Now on paper!</h1><button class="round" data-replay>🔊</button></div>
  <div class="bigtext" id="paperLetters" style="text-align:center;font-size:90px;letter-spacing:30px"></div>
  <div class="goal"><span>1️⃣ A row of each letter</span><span>2️⃣ ⭕ Circle your best one</span><span>3️⃣ 📷 Snap it</span></div>
  <button class="big c5" id="paperSnap"><span class="emoji">📷</span>Snap my page</button>
  <div class="thumbs" id="paperThumbs"></div>
</section>

<!-- GROWN-UPS (hold ⚙️ for 3 s) -->
<section id="parent" class="screen">
  <div class="head"><button class="round" data-go="home">⬅️</button><h1>Grown-ups</h1></div>
  <div class="tabs" id="ptabs">
    <button data-tab="today" class="on">Today</button><button data-tab="progress">Progress</button><button data-tab="letters">Letters</button>
    <button data-tab="words">Words</button><button data-tab="voices">Voices</button><button data-tab="export">Export &amp; print</button>
  </div>
  <div id="pbody" style="width:100%;display:flex;flex-direction:column;align-items:center"></div>
</section>

<!-- Word builder -->
<div class="overlay" id="builder"><div class="sheet">
  <div style="display:flex;gap:12px;width:100%;align-items:center">
    <div class="line" id="bLine"></div>
    <div style="display:flex;flex-direction:column;gap:8px"><button class="round" id="bRead">🔊</button><button class="round" id="bUndo">⌫</button></div>
  </div>
  <div class="check" id="bCheck"></div>
  <div id="bGroups" style="width:100%;display:flex;flex-direction:column;gap:10px"></div>
  <div class="row"><button class="big small c4" id="bType">⌨️ Type a word</button><button class="big small c3" id="bDone">✅ Done</button></div>
</div></div>

<!-- Typing box (grown-up types, or Orlando types a word) -->
<div class="overlay" id="typeBox"><div class="sheet">
  <h2 id="typeTitle" style="margin:0;font-size:30px"></h2>
  <textarea id="typeText" rows="3"></textarea>
  <div class="row"><button class="big small c5" id="typeCancel">✖️</button><button class="big small c3" id="typeOk">✅ OK</button></div>
</div></div>

<!-- Crop a photo of a paper page -->
<div class="overlay" id="crop"><div class="sheet">
  <canvas id="cropCanvas"></canvas>
  <div class="row"><button class="big small c4" id="cropRotate">🔄</button><button class="big small c5" id="cropAgain">📷 Again</button><button class="big small c3" id="cropOk">✅ Keep it</button></div>
</div></div>

<!-- Which day My Day is about -->
<div class="overlay" id="dayPick"><div class="sheet">
  <h2 style="margin:0;font-size:34px">📅</h2>
  <div class="row" id="dayList"></div>
  <button class="big small c5" id="dayClose">✖️</button>
</div></div>

<!-- A photo, full screen (tap to close) -->
<div class="overlay" id="photoView"><img id="photoBig" alt=""></div>

<!-- Stamp celebration -->
<div class="overlay" id="stampBox">
  <div class="stamp" id="stampFlag"></div>
  <h2 id="stampTitle"></h2><p id="stampSub"></p>
  <button class="big c3" id="stampOk">🎉 Yay!</button>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="camera" accept="image/*" capture="environment" hidden>

<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const el = (tag, props = {}, kids = []) => { const e = Object.assign(document.createElement(tag), props); for (const k of [].concat(kids)) if (k != null) e.append(k); return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function toast(msg, ms = 2500) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), ms); }

/* ============ STORAGE ============ */
// Small settings and progress in localStorage; recordings, photos and journal entries in IndexedDB
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const S = Object.assign({ location: '', variant: {}, unlock: 10, unlocked: {}, extraWords: [], letters: {}, stamps: [] }, store.get('travel-school', {}));
const save = () => store.set('travel-school', S);
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

let dbp;
function db() {
  return dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('travel-school', 1);
    r.onupgradeneeded = () => { const d = r.result; for (const [n, k] of [['entries', 'id'], ['blobs', 'id'], ['voices', 'key'], ['snaps', 'id']]) d.createObjectStore(n, { keyPath: k }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
}
async function tx(name, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(name, mode); let out;
    const r = fn(t.objectStore(name)); if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error);

// Simple manual crop: drag the four corners, rotate in 90° steps. Saves a JPEG up to 1600 px.
async function cropPhoto(file) {
  let img = await loadImage(file), rot = 0;
  const cv = $('#cropCanvas'), ov = $('#crop'), ctx = cv.getContext('2d');
  let box, drag = -1, scale = 1;
  const src = () => { // the photo, rotated, as a canvas
    const c = document.createElement('canvas'), q = rot % 2;
    c.width = q ? img.height : img.width; c.height = q ? img.width : img.height;
    const x = c.getContext('2d'); x.translate(c.width / 2, c.height / 2); x.rotate(rot * Math.PI / 2); x.drawImage(img, -img.width / 2, -img.height / 2);
    return c;
  };

  const layout = () => {
    base = src();
    const maxW = Math.min(1000, innerWidth * .9), maxH = innerHeight * .68;
    scale = Math.min(maxW / base.width, maxH / base.height);
    cv.width = base.width * scale; cv.height = base.height * scale;

  };

    ctx.drawImage(base, 0, 0, cv.width, cv.height);
    ctx.fillStyle = 'rgba(0,0,0,.5)'; const [x1, y1, x2, y2] = box;
    ctx.fillRect(0, 0, cv.width, y1); ctx.fillRect(0, y2, cv.width, cv.height - y2); ctx.fillRect(0, y1, x1, y2 - y1); ctx.fillRect(x2, y1, cv.width - x2, y2 - y1);
    ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 4; ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

    if (drag < 0) return; const [x, y] = pos(e);

  };

  layout(); ov.classList.add('on');
  return new Promise(resolve => {
    $('#cropRotate').onclick = () => { rot = (rot + 1) % 4; layout(); };
    $('#cropAgain').onclick = () => { ov.classList.remove('on'); URL.revokeObjectURL(img.src); resolve(snapPhoto()); };
    $('#cropOk').onclick = () => {
      const [x1, y1, x2, y2] = box.map(v => v / scale), w = x2 - x1, h = y2 - y1, k = Math.min(1, 1600 / Math.max(w, h));
      const out = document.createElement('canvas'); out.width = w * k; out.height = h * k;
      out.getContext('2d').drawImage(base, x1, y1, w, h, 0, 0, out.width, out.height);
      ov.classList.remove('on'); URL.revokeObjectURL(img.src);

    };

}

// Letters are drawn on 3-line guides: y 0 head line, 1 dotted middle, 2 baseline, 3 tail line (see travel-school/letters.json)
function sampleStroke(stroke, step = .02) {

}

function checkLetter(user, model, tol) {

  while (strokes.length > model.length) { const [a, b] = strokes.splice(-2); strokes.push(a.concat(b)); } // lifting mid-letter is OK at six

const L = ch => S.letters[ch] || (S.letters[ch] = { seen: 0, goodDays: [], stylus: false, paper: false, flag: false });

const STATUS_ICON = { new: '', learning: '🌱', stylus: '✍️', paper: '📓' };

function todaysSet() {

    const first = sampleStroke(s, .04)[0];
    return style === 'model'
      ? `<polyline points="${pts}" fill="none" stroke="#333" stroke-width="${z * .09}" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${x + first[0] * z}" cy="${first[1] * z}" r="${z * .1}" fill="#40c057"/>`

      <div style="font-size:13pt;margin:2mm 0">Dear _______________,</div>${[1, 2, 3].map(() => `<div style="margin-bottom:2mm">${lineRow(5.5, 100)}</div>`).join('')}
      <div style="font-size:13pt">From Orlando</div></div></div>`;
  return doc('Postcard planner', `<div class="pg">${card}${card}</div>`);
}
async function summaryParts() {
  const entries = (await idbAll('entries')).sort((a, b) => a.date.localeCompare(b.date));
  const paper = entries.filter(e => e.photos.length || e.paperOverride);
  const counts = {}; for (const s of S.stamps) counts[s.c] = (counts[s.c] || 0) + 1;
  const joins = {}; for (const e of entries) for (const c of WORDS.connectives) if (new RegExp('\\b' + c + '\\b', 'i').test(plainText(e))) joins[c] = (joins[c] || 0) + 1;
  const letters = LETTERS.families.flatMap(f => [...f.letters]).filter(ch => L(ch).seen || L(ch).paper);
  return `<h2>Progress summary</h2>
    <p>Recounts: ${entries.length} days talked through (oral recount with who / where / when / what / feeling), ${paper.length} written on paper, ${entries.filter(e => e.variant === 'postcard').length} postcards, ${entries.filter(e => e.variant === 'shared').length} shared-writing days.</p>
    <p>Joining words in his sentences: ${Object.entries(joins).map(([k, n]) => `${k} (${n})`).join(', ') || '—'}.</p>
    <p>Stamps: ${ROUTE.filter(c => counts[c]).map(c => `${C(c).name} ${counts[c]}`).join(', ') || '—'}.</p>
    <p>Letter formation (NSW Foundation Style): ${letters.map(ch => `<b>${ch}</b> ${letterStatus(ch)}`).join(', ') || '—'}.</p>`;
}
async function summaryHtml() { return doc('Orlando progress', `<h1>Orlando's Travel School</h1>${await summaryParts()}`); }
async function imgData(id, max = 1000) { // smaller copies keep the file a sensible size
  const b = await getBlob(id); if (!b) return '';
  const im = await loadImage(b), k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
  c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(im.src);
  return c.toDataURL('image/jpeg', .8);
}
async function travelBookHtml(withAudio) {
  const entries = (await idbAll('entries')).filter(e => e.photos.length || e.paperOverride || plainText(e).trim()).sort((a, b) => a.date.localeCompare(b.date));
  const snaps = (await idbAll('snaps')).sort((a, b) => a.date.localeCompare(b.date));
  let h = `<div class="pg"><h1 style="font-size:30pt">✈️ Orlando's Travel Book</h1><p>Year 1 · Europe trip, ${niceDate(TRIP.start)} – ${niceDate(TRIP.end)}</p>
    <p class="note">Each day: Orlando told his recount out loud (who, where, when, what happened, feelings), chose his best sentence, then wrote it on paper with a drawing. Blue = his writing, green = scribed by a parent on shared-writing days.</p>${await summaryParts()}</div>`;
  for (const e of entries) {
    const c = C(e.country);
    h += `<div class="pg"><h2>${c.flag} ${esc(niceDate(e.date))} · ${esc(c.name)} ${e.variant !== 'normal' ? '· ' + VARIANTS[e.variant].name : ''}${e.posted ? ' · posted 📮' : ''}</h2>
      <p style="font-size:18pt;line-height:1.5">${writeHtml(e).replace(/class="mine"/g, 'style="color:#1c5fd4"').replace(/class="theirs"/g, 'style="color:#2b8a3e"')}</p>`;
    for (const id of e.photos) h += `<img src="${await imgData(id)}" style="max-width:100%;max-height:200mm;display:block;margin:3mm 0;border-radius:2mm">`;
    if (e.paperOverride && !e.photos.length) h += '<p class="note">Written on paper (no photo).</p>';
    if (withAudio) for (const p of WORDS.prompts) if (e.clips[p.key]) {
      const b = await getBlob(e.clips[p.key]); if (b) h += `<div class="note">${p.icon} ${p.word} <audio controls src="${await blobToDataUrl(b)}"></audio></div>`;
    }
    h += '</div>';
  }
  if (snaps.length) {
    h += '<div class="pg"><h2>✍️ Handwriting pages</h2><p class="note">Letter families practised on paper after stylus practice. He circled his best letter of each.</p>';
    for (const s of snaps) h += `<p><b>${esc(niceDate(s.date))}</b>: ${esc(s.letters)}</p><img src="${await imgData(s.photo)}" style="max-width:100%;max-height:120mm;border-radius:2mm">`;
    h += '</div>';
  }
  return doc("Orlando's Travel Book", h, 'audio { height: 28px; vertical-align: middle; }');
}

(async function start() {
  const j = f => fetch('travel-school/' + f).then(r => r.json());
  [TRIP, WORDS, LETTERS] = await Promise.all([j('trip.json'), j('words.json'), j('letters.json')]);
  await loadVoices();
  go('home');
})();
</script>
